# Runs on every pull request and every push to master: types, lint, unused code (knip) and the
# @calorie/core tests for every workspace. Database tests (supabase/tests, from T011) run in their
# own job only when the dev project's secrets are configured, so forks without secrets still pass.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Core tests
        run: npm test -w @calorie/core

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.SUPABASE_URL != ''
      - name: Database tests against the dev project
        if: env.SUPABASE_URL != '' && hashFiles('supabase/tests/*.test.ts') != ''
        run: npm test -w @calorie/db
